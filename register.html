<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - ArtSkillWallet</title>
</head>
<body>
    <main class="auth-layout">
        <aside class="auth-banner">
            <img src="art-bg.jpg" alt="Abstract Art Background">
        </aside>

        <section class="auth-content">
            <header class="auth-header">
                <img src="logo.png" alt="ArtSkillWallet Logo">
                <nav class="auth-tabs">
                    <a href="login.html">LOGIN</a>
                    <a href="register.html" class="active">REGISTER</a>
                </nav>
            </header>

            <form class="register-form">
                <div class="form-group">
                    <input type="text" placeholder="Name" required>
                </div>
                <div class="form-group">
                    <input type="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Password" required>
                    <button type="button" class="toggle-password" aria-label="Show password"></button>
                </div>
                <div class="form-group">
                    <input type="password" placeholder="Confirm Password" required>
                    <button type="button" class="toggle-password" aria-label="Show password"></button>
                </div>
                <button type="submit" class="btn-primary">REGISTER</button>
            </form>
        </section>
    </main>
</body>
</html>
