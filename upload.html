<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ArtSkillWallet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/upload.css">
</head>
<body>

    <header class="main-header">
        <div class="logo-container">
            <img src="img/LogoPlaceHolder.jpg" height="45px" alt="Logo">
            <span class="ArtSkillWallet">ArtSkillWallet</span>
        </div>
        <nav>
            <ul class="headSectorHolder">
                <li class="headSector">Explore</li>
                <li class="headSector active">Skills</li>
                <li class="headSector">History</li>
            </ul>
        </nav>
        <div class="profile-icon">
            <i class="fas fa-user-circle fa-2x" id="userProfile"></i>
        </div>
    </header>

    <main class="bodyPage">
        <div class="form-container">

            <!-- Upload Artwork -->
            <section class="form-section">
                <h2 class="section-title">Artwork</h2>
                <label class="upload-box" for="artworkUpload">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span class="upload-label">Click or Drag File</span>
                    <span class="upload-hint">PNG, JPG, MP4 — max 50MB</span>
                    <input type="file" id="artworkUpload" accept="image/*,video/*" hidden>
                </label>
            </section>

            <!-- Title -->
            <section class="form-section">
                <h2 class="section-title">Title</h2>
                <input type="text" class="input-field" placeholder="Enter title...">
            </section>

            <!-- Description -->
            <section class="form-section">
                <h2 class="section-title">Description</h2>
                <textarea class="input-field textarea" placeholder="Describe your work..."></textarea>
            </section>

            <!-- Details -->
            <section class="form-section">
                <h2 class="section-title">Details</h2>
                <div class="details-grid">

                    <div class="input-group">
                        <label>Search the Skills</label>
                        <input type="text" class="input-field" placeholder="e.g. Illustration, UI Design...">
                    </div>

                    <div class="input-group">
                        <label>Account Skills</label>
                        <input type="text" class="input-field" placeholder="e.g. Photoshop, Figma...">
                    </div>

                    <div class="input-group">
                        <label>Primary Skills</label>
                        <input type="text" class="input-field" placeholder="e.g. Digital Art...">
                    </div>

                    <div class="input-group">
                        <label>Project Complete Date</label>
                        <input type="date" class="input-field">
                    </div>

                </div>
            </section>

            <!-- Upload Evidence -->
            <section class="form-section">
                <h2 class="section-title">Upload Evidence</h2>
                <label class="upload-box upload-box--small" for="evidenceUpload">
                    <i class="fas fa-paperclip"></i>
                    <span class="upload-label">Click or Drag File</span>
                    <span class="upload-hint">PDF, PNG, JPG — max 10MB</span>
                    <input type="file" id="evidenceUpload" accept="image/*,.pdf" hidden>
                </label>
            </section>

            <!-- Privacy -->
            <section class="form-section">
                <h2 class="section-title">Privacy Setting</h2>
                <div class="privacy-toggle">
                    <input type="radio" name="privacy" id="public" value="public" checked>
                    <label for="public" class="privacy-btn">
                        <i class="fas fa-globe"></i> Public
                    </label>

                    <input type="radio" name="privacy" id="private" value="private">
                    <label for="private" class="privacy-btn">
                        <i class="fas fa-lock"></i> Private
                    </label>
                </div>
            </section>

            <!-- Publish -->
            <button class="publish-btn">PUBLISH</button>

        </div>
    </main>

    <footer class="footer"></footer>

</body>
</html>
