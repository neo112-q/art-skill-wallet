<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile – ArtSkillWallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
<div id="app">

  <!-- Navbar -->
  <nav class="navbar" aria-label="Main navigation">
    <div class="navbar-inner">
      <a href="/home.html" class="nav-logo">
        <img src="/img/logoartskill.png" height="32" alt="ArtSkillWallet Logo">
        <span class="nav-logo-text">ArtSkillWallet</span>
      </a>
      <div class="nav-links">
        <a href="/explore.html" class="nav-link">Explore</a>
        <a href="/skillManage.html" class="nav-link">Skills</a>
        <a href="/history.html" class="nav-link">History</a>
      </div>
      <div class="avatar-wrapper">
        <img :src="displayAvatar" alt="User avatar" class="avatar-sm" @click.stop="dropdownOpen = !dropdownOpen">
        <div class="avatar-dropdown" :class="{ open: dropdownOpen }">
          <div class="avatar-dropdown-header">
            <img :src="displayAvatar" alt="User avatar" class="avatar-dropdown-pic">
            <div>
              <p class="avatar-dropdown-name">{{ form.username }}</p>
              <p class="avatar-dropdown-email">{{ form.email }}</p>
            </div>
          </div>
          <div class="avatar-dropdown-divider"></div>
          <a href="/profile.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">👤</span> Profile</a>
          <a v-if="isAdmin" href="/admin.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">🛡️</span> Admin</a>
          <div class="avatar-dropdown-divider"></div>
          <button class="avatar-dropdown-item avatar-dropdown-logout" @click="doLogout"><span class="avatar-dropdown-icon">🚪</span> Logout</button>
        </div>
      </div>
      <button class="hamburger-btn" :class="{ open: mobileOpen }" @click="mobileOpen = !mobileOpen" aria-label="Menu">
        <span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span>
      </button>
    </div>
  </nav>

  <!-- Loading -->
  <main v-if="loading" class="page-main" style="text-align:center; padding:6rem; color:#888;">Loading profile...</main>

  <!-- Main -->
  <main v-else class="page-main">

    <div class="edit-profile-header fade-in">
      <a href="/profile.html" class="edit-profile-back">&larr; Back to Profile</a>
      <h1 class="edit-profile-title">Edit Profile</h1>
    </div>

    <form class="edit-profile-form fade-in-2" @submit.prevent="saveProfile">

      <!-- Avatar -->
      <div class="edit-avatar-section">
        <div class="edit-avatar-wrap">
          <img :src="avatarPreview" alt="Profile avatar" class="edit-avatar-img">
          <label for="avatarFileInput" class="edit-avatar-change">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </label>
          <input type="file" id="avatarFileInput" accept="image/*" hidden @change="onAvatarChange">
        </div>
        <div>
          <p class="edit-avatar-hint">Click the pencil to upload a new photo</p>
          <p class="edit-avatar-hint" style="color:#444;">JPG, PNG — max 5MB</p>
        </div>
      </div>

      <!-- Fields -->
      <div class="edit-profile-fields">

        <div class="edit-field-group">
          <div class="edit-field">
            <label class="edit-label">Username</label>
            <input type="text" class="edit-input" v-model="form.username" placeholder="your_username">
          </div>
          <div class="edit-field">
            <label class="edit-label">Email</label>
            <input type="email" class="edit-input" v-model="form.email" placeholder="you@example.com">
          </div>
        </div>

        <div class="edit-field">
          <label class="edit-label">Bio</label>
          <textarea class="edit-input edit-textarea" v-model="form.bio" placeholder="Tell the world about yourself..."></textarea>
        </div>

        <!-- Divider -->
        <div class="edit-section-divider"><span>Change Password</span></div>

        <div class="edit-field-group">
          <div class="edit-field">
            <label class="edit-label">Current Password</label>
            <input type="password" class="edit-input" v-model="form.old_password" placeholder="••••••••">
          </div>
          <div class="edit-field">
            <label class="edit-label">New Password</label>
            <input type="password" class="edit-input" v-model="form.new_password" placeholder="••••••••">
          </div>
        </div>

        <div class="edit-field" style="max-width:340px;">
          <label class="edit-label">Confirm New Password</label>
          <input type="password" class="edit-input" v-model="confirmPw" placeholder="••••••••">
        </div>

      </div>

      <!-- Actions -->
      <div class="edit-profile-actions">
        <div v-if="msg" class="ep-msg" :class="'ep-msg-' + msgType">{{ msg }}</div>
        <div style="display:flex; gap:1rem; flex-wrap:wrap;">
          <a href="/profile.html" class="btn-outline">Cancel</a>
          <button type="submit" class="btn-neon" :disabled="saving">{{ saving ? 'Saving...' : 'Save Changes' }}</button>
        </div>
      </div>

    </form>
  </main>

</div>

<script src="/js/app.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
if (!TokenStore.isLoggedIn()) { window.location.replace('/home.html'); }
const { createApp } = Vue;
createApp({
  data() {
    return {
      isAdmin: TokenStore.isAdmin(),
      dropdownOpen: false,
      mobileOpen: false,
      loading: true,
      saving: false,
      msg: '', msgType: 'success',
      currentAvatar: '',
      avatarPreview: '',
      pendingAvatarFile: null,
      form: { username: '', email: '', bio: '', old_password: '', new_password: '' },
      confirmPw: '',
    };
  },
  computed: {
    displayAvatar() {
      return this.avatarPreview || this.currentAvatar ||
        'https://ui-avatars.com/api/?name=' + encodeURIComponent(this.form.username || 'U') + '&background=CCFF00&color=121212&bold=true&size=200';
    },
  },
  methods: {
    doLogout() { logout(); },

    onAvatarChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      this.pendingAvatarFile = file;
      const reader = new FileReader();
      reader.onload = (ev) => { this.avatarPreview = ev.target.result; };
      reader.readAsDataURL(file);
    },

    async saveProfile() {
      this.msg = '';

      // Client-side validation
      if (!this.form.username || this.form.username.length < 3) {
        this.msg = 'Username must be at least 3 characters.'; this.msgType = 'error'; return;
      }
      if (!this.form.email) {
        this.msg = 'Email is required.'; this.msgType = 'error'; return;
      }
      if (this.form.new_password && this.form.new_password !== this.confirmPw) {
        this.msg = 'New passwords do not match.'; this.msgType = 'error'; return;
      }

      this.saving = true;

      // ── Step 1: Upload avatar if changed ──────────────────────────
      if (this.pendingAvatarFile) {
        const fd = new FormData();
        fd.append('avatar', this.pendingAvatarFile);
        const avRes = await apiUpload('/me/avatar', fd);
        if (avRes.ok) {
          const newUrl = avRes.data.data?.profile_picture || avRes.data.data;
          this.currentAvatar     = newUrl;
          this.avatarPreview     = newUrl;
          this.pendingAvatarFile = null;
        } else {
          const errMsg = avRes.data?.error_message || ('HTTP ' + avRes.status);
          this.msg = 'Avatar upload failed: ' + errMsg;
          this.msgType = 'error';
          this.saving = false;
          return;
        }
      }

      // ── Step 2: Update profile fields ─────────────────────────────
      const payload = {
        username: this.form.username,
        email: this.form.email,
        bio: this.form.bio,
        old_password: this.form.old_password || '',
        new_password: this.form.new_password || '',
      };

      console.log('[EDIT] Sending PUT /me …', { ...payload, old_password: '***', new_password: payload.new_password ? '***' : '' });
      const r = await apiFetch('/me', { method: 'PUT', body: JSON.stringify(payload) });
      console.log('[EDIT] Response:', r.status, r.data);

      if (r.ok) {
        // Update stored username
        localStorage.setItem('username', this.form.username);
        alert('Profile saved successfully!');
        this.msg = 'Profile saved!'; this.msgType = 'success';
        this.form.old_password = '';
        this.form.new_password = '';
        this.confirmPw = '';
        setTimeout(() => { window.location.href = '/profile.html'; }, 800);
      } else {
        this.msg = r.data.error_message || 'Failed to save profile.'; this.msgType = 'error';
        console.error('[EDIT] Failed:', this.msg);
      }
      this.saving = false;
    },
  },
  async mounted() {
    document.addEventListener('click', () => { this.dropdownOpen = false; });

    console.log('[EDIT] Fetching /me …');
    const r = await apiFetch('/me');
    if (r.ok && r.data.data) {
      const u = r.data.data;
      this.form.username = u.username || '';
      this.form.email = u.email || '';
      this.form.bio = u.bio || '';
      this.currentAvatar = u.profile_picture || '';
      this.avatarPreview = u.profile_picture || '';
      console.log('[EDIT] Loaded user:', u.username);
    } else {
      console.error('[EDIT] Failed to load profile');
    }
    this.loading = false;
  }
}).mount('#app');
</script>
</body>
</html>
