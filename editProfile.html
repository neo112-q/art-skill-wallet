<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile – ArtSkillWallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">

  <!-- Navbar -->
  <nav class="navbar" aria-label="Main navigation">
    <div class="navbar-inner">
      <a href="/home.html" class="nav-logo">
        <img src="/img/logoartskill.png" height="32" alt="ArtSkillWallet Logo">
        <span class="nav-logo-text">ArtSkillWallet</span>
      </a>
      <div class="nav-links">
        <a href="/explore.html" class="nav-link">Explore</a>
        <a href="/skillManage.html" class="nav-link">Skills</a>
        <a href="/history.html" class="nav-link">History</a>
      </div>
      <div class="avatar-wrapper">
        <img :src="avatarUrl" alt="User avatar" class="avatar-sm" @click.stop="dropdownOpen = !dropdownOpen">
        <div class="avatar-dropdown" :class="{ open: dropdownOpen }">
          <div class="avatar-dropdown-header">
            <img :src="avatarUrl" alt="User avatar" class="avatar-dropdown-pic">
            <div>
              <p class="avatar-dropdown-name">{{ form.username }}</p>
              <p class="avatar-dropdown-email">{{ form.email }}</p>
            </div>
          </div>
          <div class="avatar-dropdown-divider"></div>
          <a href="/profile.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">👤</span> Profile</a>
          <a v-if="isAdmin" href="/admin.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">🛡️</span> Admin</a>
          <div class="avatar-dropdown-divider"></div>
          <button class="avatar-dropdown-item avatar-dropdown-logout" @click="doLogout"><span class="avatar-dropdown-icon">🚪</span> Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Main -->
  <main class="page-main">

    <div class="edit-profile-header fade-in">
      <a href="/profile.html" class="edit-profile-back">&larr; Back to Profile</a>
      <h1 class="edit-profile-title">Edit Profile</h1>
    </div>

    <form class="edit-profile-form fade-in-2" @submit.prevent="saveProfile">

      <!-- Avatar -->
      <div class="edit-avatar-section">
        <div class="edit-avatar-wrap">
          <img :src="avatarPreview" alt="Profile avatar" class="edit-avatar-img">
          <label for="avatarFileInput" class="edit-avatar-change">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </label>
          <input type="file" id="avatarFileInput" accept="image/*" hidden @change="onAvatarChange">
        </div>
        <div>
          <p class="edit-avatar-hint">Click the pencil to upload a new photo</p>
          <p class="edit-avatar-hint" style="color:#444;">JPG, PNG — max 5MB</p>
        </div>
      </div>

      <!-- Fields -->
      <div class="edit-profile-fields">

        <div class="edit-field-group">
          <div class="edit-field">
            <label class="edit-label">Username</label>
            <input type="text" class="edit-input" v-model="form.username" placeholder="your_username">
          </div>
          <div class="edit-field">
            <label class="edit-label">Email</label>
            <input type="email" class="edit-input" v-model="form.email" placeholder="you@example.com">
          </div>
        </div>

        <div class="edit-field">
          <label class="edit-label">Bio</label>
          <textarea class="edit-input edit-textarea" v-model="form.bio" placeholder="Tell the world about yourself..."></textarea>
        </div>

        <div class="edit-field-group">
          <div class="edit-field">
            <label class="edit-label">Website / Portfolio</label>
            <input type="url" class="edit-input" v-model="form.website" placeholder="https://yoursite.com">
          </div>
          <div class="edit-field">
            <label class="edit-label">Twitter / X</label>
            <input type="text" class="edit-input" v-model="form.twitter" placeholder="@username">
          </div>
        </div>

        <div class="edit-field-group">
          <div class="edit-field">
            <label class="edit-label">Instagram</label>
            <input type="text" class="edit-input" v-model="form.instagram" placeholder="@username">
          </div>
          <div class="edit-field">
            <label class="edit-label">Location</label>
            <input type="text" class="edit-input" v-model="form.location" placeholder="City, Country">
          </div>
        </div>

        <div class="edit-section-divider"><span>Account</span></div>

        <div class="edit-field-group">
          <div class="edit-field">
            <label class="edit-label">Current Password</label>
            <input type="password" class="edit-input" v-model="form.currentPw" placeholder="••••••••">
          </div>
          <div class="edit-field">
            <label class="edit-label">New Password</label>
            <input type="password" class="edit-input" v-model="form.newPw" placeholder="••••••••">
          </div>
        </div>

        <div class="edit-field" style="max-width:340px;">
          <label class="edit-label">Confirm New Password</label>
          <input type="password" class="edit-input" v-model="form.confirmPw" placeholder="••••••••">
        </div>

      </div>

      <!-- Actions -->
      <div class="edit-profile-actions">
        <div v-if="msg" class="ep-msg" :class="'ep-msg-' + msgType">{{ msg }}</div>
        <div style="display:flex; gap:1rem; flex-wrap:wrap;">
          <a href="/profile.html" class="btn-outline">Cancel</a>
          <button type="submit" class="btn-neon">Save Changes</button>
        </div>
      </div>

    </form>

  </main>

</div>

<script src="/js/app.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
if (!TokenStore.isLoggedIn()) { window.location.replace('/home.html'); }
const { createApp } = Vue;
createApp({
  data() {
    return {
      isAdmin: TokenStore.isAdmin(),
      dropdownOpen: false,
      avatarUrl: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80',
      avatarPreview: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=200&q=80',
      form: {
        username: TokenStore.getUsername() || 'Navvy_Art',
        email: '',
        bio: 'Creative digital artist specializing in fantasy and sci-fi concept art. Full-time creator.',
        website: '', twitter: '', instagram: '', location: '',
        currentPw: '', newPw: '', confirmPw: '',
      },
      msg: '', msgType: 'success',
    };
  },
  methods: {
    doLogout() { logout(); },
    onAvatarChange(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => { this.avatarPreview = ev.target.result; };
      reader.readAsDataURL(file);
    },
    saveProfile() {
      if (this.form.newPw && this.form.newPw !== this.form.confirmPw) { this.msg = 'Passwords do not match.'; this.msgType = 'error'; return; }
      if (this.form.newPw && this.form.newPw.length < 6) { this.msg = 'New password must be at least 6 characters.'; this.msgType = 'error'; return; }
      // TODO: send to backend API
      this.msg = 'Profile saved successfully!'; this.msgType = 'success';
      setTimeout(() => { window.location.href = '/profile.html'; }, 1200);
    },
  },
  mounted() {
    document.addEventListener('click', () => { this.dropdownOpen = false; });
    apiFetch('/me').then(r => {
      if (r.ok && r.data.data) {
        const u = r.data.data;
        this.form.username = u.username || this.form.username;
        this.form.email = u.email || '';
        if (u.bio) this.form.bio = u.bio;
        if (u.profile_picture) { this.avatarUrl = u.profile_picture; this.avatarPreview = u.profile_picture; }
      }
    });
  }
}).mount('#app');
</script>
</body>
</html>
