<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Skills – ArtSkillWallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css?v=2">
</head>
<body>
<div id="app">

  <!-- Navbar -->
  <nav class="navbar" aria-label="Main navigation">
    <div class="navbar-inner">
      <a href="/home.html" class="nav-logo">
        <img src="/img/logoartskill.png" height="32" alt="ArtSkillWallet Logo">
        <span class="nav-logo-text">ArtSkillWallet</span>
      </a>
      <div class="nav-links">
        <a href="/explore.html" class="nav-link">Explore</a>
        <a href="/skillManage.html" class="nav-link active">Skills</a>
        <a href="/history.html" class="nav-link">History</a>
      </div>
      <div class="avatar-wrapper">
        <img :src="avatarUrl" alt="User avatar" class="avatar-sm" @click.stop="dropdownOpen = !dropdownOpen">
        <div class="avatar-dropdown" :class="{ open: dropdownOpen }">
          <div class="avatar-dropdown-header">
            <img :src="avatarUrl" alt="User avatar" class="avatar-dropdown-pic">
            <div>
              <p class="avatar-dropdown-name">{{ username }}</p>
              <p class="avatar-dropdown-email">{{ email }}</p>
            </div>
          </div>
          <div class="avatar-dropdown-divider"></div>
          <a href="/profile.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">👤</span> Profile</a>
          <a v-if="isAdmin" href="/admin.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">🛡️</span> Admin</a>
          <div class="avatar-dropdown-divider"></div>
          <button class="avatar-dropdown-item avatar-dropdown-logout" @click="doLogout"><span class="avatar-dropdown-icon">🚪</span> Logout</button>
        </div>
      </div>
      <button class="hamburger-btn" :class="{ open: mobileOpen }" @click="mobileOpen = !mobileOpen" aria-label="Menu">
        <span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Nav Drawer -->
  <div class="mobile-nav" :class="{ open: mobileOpen }" @click.self="mobileOpen=false">
    <a href="/explore.html" class="mobile-nav-link"><i class="fas fa-compass"></i> Explore</a>
    <a href="/skillManage.html" class="mobile-nav-link active"><i class="fas fa-star"></i> Skills</a>
    <a href="/history.html" class="mobile-nav-link"><i class="fas fa-history"></i> History</a>
    <div class="mobile-nav-divider"></div>
    <a href="/profile.html" class="mobile-nav-link"><i class="fas fa-user"></i> Profile</a>
    <a v-if="isAdmin" href="/admin.html" class="mobile-nav-link"><i class="fas fa-shield-alt"></i> Admin</a>
    <button class="mobile-nav-link" style="background:none;border:none;cursor:pointer;color:#ff6b6b;width:100%;text-align:left;" @click="doLogout"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <!-- Main -->
  <main class="page-main" style="max-width:960px; margin:0 auto; min-height:calc(100vh - 64px - 280px);">

    <!-- Header -->
    <div class="fade-in" style="display:flex; align-items:center; justify-content:space-between; gap:1rem; flex-wrap:wrap; margin-bottom:2rem;">
      <div>
        <h1 style="font-size:1.5rem; font-weight:800;">My Skills</h1>
        <p style="color:#888; font-size:0.85rem; margin-top:0.25rem;">Ranks are earned automatically when your artwork is approved</p>
      </div>
      <a href="/upload.html" class="btn-neon"><i class="fas fa-cloud-upload-alt" style="font-size:0.7rem;"></i> Upload Art</a>
    </div>

    <!-- Loading -->
    <div v-if="loading" style="text-align:center; padding:3rem; color:#888;">Loading skills...</div>

    <template v-else>

    <!-- Filter bar -->
    <div v-if="ranks.length" class="fade-in-2" style="background:#1C1C1C; border:1px solid #2A2A2A; border-radius:12px; padding:0.85rem 1rem; display:flex; flex-wrap:wrap; gap:0.75rem; align-items:center; margin-bottom:1.5rem;">
      <!-- Search -->
      <div style="display:flex; align-items:center; gap:0.5rem; background:#121212; border:1px solid #2A2A2A; border-radius:8px; padding:0.4rem 0.75rem; flex:1; min-width:160px;">
        <i class="fas fa-search" style="color:#555; font-size:0.8rem;"></i>
        <input type="text" v-model="filterName" placeholder="Search skill..." style="background:transparent; border:none; outline:none; color:white; font-size:0.83rem; width:100%;">
      </div>
      <!-- Main skill filter -->
      <select v-model="filterMain" style="background:#121212; border:1px solid #2A2A2A; border-radius:8px; padding:0.4rem 0.75rem; color:white; font-size:0.83rem; outline:none;">
        <option value="">All Categories</option>
        <option v-for="m in uniqueMains" :key="m" :value="m">{{ m }}</option>
      </select>
      <!-- Rank filter -->
      <select v-model="filterRank" style="background:#121212; border:1px solid #2A2A2A; border-radius:8px; padding:0.4rem 0.75rem; color:white; font-size:0.83rem; outline:none;">
        <option value="">All Ranks</option>
        <option>Beginner</option>
        <option>Intermediate</option>
        <option>Advanced</option>
      </select>
      <!-- Clear -->
      <button v-if="filterName || filterMain || filterRank" @click="filterName=''; filterMain=''; filterRank=''"
        style="background:none; border:1px solid #2A2A2A; border-radius:8px; padding:0.4rem 0.75rem; color:#888; font-size:0.8rem; cursor:pointer;">
        Clear
      </button>
      <span style="font-size:0.75rem; color:#555; margin-left:auto;">{{ filteredRanks.length }} skill{{ filteredRanks.length !== 1 ? 's' : '' }}</span>
    </div>

    <!-- Empty State -->
    <div v-if="!ranks.length" style="text-align:center; padding:3rem; color:#666;">
      <p style="font-size:1.1rem; margin-bottom:0.5rem;">No skill ranks yet.</p>
      <p style="font-size:0.85rem; color:#555;">Upload artwork and get it approved to earn your first rank.</p>
    </div>
    <div v-else-if="!filteredRanks.length" style="text-align:center; padding:2rem; color:#555;">
      No skills match your filters.
    </div>

    <!-- Skills Grid -->
    <div v-else class="skills-grid fade-in-2">
      <div class="skill-card" v-for="r in filteredRanks" :key="r.id">
        <div style="font-size:0.72rem; color:#555; margin-bottom:0.25rem; text-transform:uppercase; letter-spacing:0.05em;">{{ r.main_skill_name }}</div>
        <h3 style="margin-bottom:0.75rem;">{{ r.display_name }}</h3>

        <!-- Progress bar -->
        <div class="meter" style="margin-bottom:0.25rem;">
          <div class="seg" :style="{ background: r.approval_count >= 1  ? '#CCFF00' : '#333' }"></div>
          <div class="seg" :style="{ background: r.approval_count >= 10 ? '#3B82F6' : '#333' }"></div>
          <div class="seg" :style="{ background: r.approval_count >= 25 ? '#F59E0B' : '#333' }"></div>
        </div>
        <div class="meter-labels"><span>Beginner</span><span>Intermediate</span><span>Advanced</span></div>

        <!-- Approvals count & next milestone -->
        <p style="color:#aaa; font-size:0.75rem; margin-top:0.5rem;">
          {{ r.approval_count }} approval{{ r.approval_count !== 1 ? 's' : '' }}
          <span v-if="r.rank !== 'Advanced'" style="color:#555;">
            · {{ r.target - r.approval_count }} more to {{ r.next_rank }}
          </span>
          <span v-else style="color:#CCFF00;"> · Max rank reached!</span>
        </p>

        <!-- Badge -->
        <div style="margin-top:1rem;">
          <span v-if="r.rank" class="badge" :class="badgeClass(r.rank)">
            <i class="fas" :class="badgeIcon(r.rank)" style="font-size:0.7rem;"></i> {{ r.rank }}
          </span>
          <span v-else style="color:#555; font-size:0.8rem;">No rank yet</span>
        </div>

        <!-- Tip / Roadmap -->
        <div :style="rankTipStyle(r.rank)" style="margin-top:1rem; padding:0.6rem 0.8rem; border-radius:8px; font-size:0.78rem; line-height:1.5;">
          <i class="fas" :class="rankTipIcon(r.rank)" style="margin-right:0.4rem;"></i>
          <span>{{ rankTip(r.rank, r.target - r.approval_count, r.next_rank) }}</span>
        </div>
      </div>
    </div>

    </template>
  </main>

</div>

<script src="/js/app.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
if (!TokenStore.isLoggedIn()) { window.location.replace('/home.html'); }
const { createApp } = Vue;
createApp({
  data() {
    return {
      isAdmin: TokenStore.isAdmin(),
      username: TokenStore.getUsername() || 'User',
      email: '',
      avatarUrl: 'https://ui-avatars.com/api/?name=' + encodeURIComponent(TokenStore.getUsername() || 'U') + '&background=CCFF00&color=121212&bold=true&size=100',
      dropdownOpen: false,
      mobileOpen: false,
      loading: true,
      ranks: [],
      filterName: '',
      filterMain: '',
      filterRank: '',
    };
  },
  computed: {
    uniqueMains() {
      return [...new Set(this.ranks.map(r => r.main_skill_name).filter(Boolean))];
    },
    filteredRanks() {
      const n = this.filterName.toLowerCase();
      const m = this.filterMain;
      const r = this.filterRank;
      return this.ranks.filter(rank =>
        (!n || rank.display_name.toLowerCase().includes(n) || rank.main_skill_name.toLowerCase().includes(n)) &&
        (!m || rank.main_skill_name === m) &&
        (!r || rank.rank === r)
      );
    },
  },
  methods: {
    doLogout() { logout(); },
    badgeClass(r) { return r === 'Beginner' ? 'badge-beg' : r === 'Intermediate' ? 'badge-inter' : 'badge-adv'; },
    badgeIcon(r)  { return r === 'Beginner' ? 'fa-seedling' : r === 'Intermediate' ? 'fa-fire' : 'fa-crown'; },
    rankTip(rank) {
      const tips = {
        '': [
          'เริ่มต้นด้วยการฝึกพื้นฐานให้แม่น เช่น สัดส่วน เส้น และแสงเงา',
          'ศึกษาตัวอย่างงานของศิลปินที่คุณชื่นชอบ แล้วลองฝึกตาม',
          'อัปโหลดผลงานพร้อมแนบหลักฐาน process เพื่อเริ่มสะสม rank',
        ],
        'Beginner': [
          'ฝึกซ้ำ ๆ กับ subject เดิมจนคุณรู้สึกควบคุมได้ก่อนขยับไปสิ่งใหม่',
          'แนบภาพ before–after ในผลงานเพื่อแสดงพัฒนาการที่ชัดเจน',
          'ลองเปลี่ยนสไตล์หรือ medium ใหม่ เพื่อค้นหาแนวทางที่ถนัด',
          'ตั้งเป้าฝึกอย่างน้อยสัปดาห์ละ 2–3 ชิ้น เพื่อสร้างความสม่ำเสมอ',
        ],
        'Intermediate': [
          'เริ่มสร้างสไตล์เป็นของตัวเอง แทนการ copy ตาม reference อย่างเดียว',
          'ลองทำ series ผลงานที่มี theme เดียวกัน เพื่อแสดงความลึกของทักษะ',
          'บันทึก process วิดีโอหรือ step-by-step เพื่อเป็นหลักฐานที่น่าเชื่อถือ',
          'รับ feedback จากคนอื่นและนำมาปรับปรุงผลงานชิ้นถัดไป',
        ],
        'Advanced': [
          'ลองรับ commission หรือ project จริงเพื่อทดสอบทักษะในสถานการณ์จริง',
          'สอนหรือแชร์ความรู้ให้คนอื่น — การสอนช่วยให้เข้าใจลึกยิ่งขึ้น',
          'ขยายไปยัง sub-skill ที่เกี่ยวข้องเพื่อพัฒนาความเชี่ยวชาญแบบรอบด้าน',
          'สร้าง portfolio ที่แสดงงานหลากหลาย เพื่อเพิ่มโอกาสในสายอาชีพ',
        ],
      };
      const list = tips[rank] || tips[''];
      return list[Math.floor(Date.now() / 86400000) % list.length];
    },
    rankTipIcon(rank) {
      if (!rank) return 'fa-rocket';
      if (rank === 'Advanced') return 'fa-star';
      if (rank === 'Intermediate') return 'fa-bolt';
      return 'fa-map-signs';
    },
    rankTipStyle(rank) {
      if (!rank) return 'background:#1C1C1C; color:#888; border:1px solid #2A2A2A;';
      if (rank === 'Advanced') return 'background:#2a210f; color:#F59E0B; border:1px solid #5a4a2a;';
      if (rank === 'Intermediate') return 'background:#1a1a2a; color:#7eb8f7; border:1px solid #2a2a5a;';
      return 'background:#1a2a1a; color:#CCFF00; border:1px solid #3a5a3a;';  /* Beginner → green */
    },
  },
  async mounted() {
    document.addEventListener('click', () => { this.dropdownOpen = false; });

    const [meRes, rankRes] = await Promise.all([
      apiFetch('/me'),
      apiFetch('/my-ranks'),
    ]);

    if (meRes.ok && meRes.data.data) {
      const user = meRes.data.data;
      this.username  = user.username || TokenStore.getUsername();
      this.email     = user.email    || '';
      this.avatarUrl = user.profile_picture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.username || 'U') + '&background=CCFF00&color=121212&bold=true&size=100';
    }

    if (rankRes.ok && rankRes.data.data) {
      this.ranks = rankRes.data.data;
    } else {
      console.error('[SKILLS] Failed to load ranks:', rankRes.data?.error_message);
    }

    this.loading = false;
  }
}).mount('#app');
</script>
</body>
</html>
