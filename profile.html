<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile - ArtSkillWallet</title>
</head>
<body>
    <header class="main-header">
        <img src="logo.png" alt="ArtSkillWallet Logo">
        <nav class="main-nav">
            <a href="#explore">Explore</a>
            <a href="#skills">Skills</a>
            <a href="#history">History</a>
        </nav>
        <div class="user-menu">
            <img src="avatar-small.jpg" alt="User Profile" class="avatar-sm">
        </div>
    </header>

    <main class="profile-page">
        <section class="profile-info">
            <img src="avatar-large.jpg" alt="Navvy_Art Avatar" class="avatar-lg">
            <div class="info-details">
                <h1>Navvy_Art</h1>
                <p class="bio">Bio: "Creative-digital artist specializing in fantasy and sci-fi concept art. Full-time creator."</p>
                <div class="ranking">
                    <label>Total Point / ranking</label>
                    <progress value="70" max="100"></progress>
                </div>
            </div>
        </section>

        <section class="skill-showcase">
            <header class="section-header">
                <h2>Skill Showcase</h2>
                <button class="btn-action">View Skill &rarr;</button>
            </header>
            <div class="skills-grid">
                <article class="skill-card">
                    <h3>skill name</h3>
                    <div class="skill-meter">
                        <div class="meter-bar beginner"></div>
                        <div class="meter-bar intermediate"></div>
                        <div class="meter-bar advanced"></div>
                    </div>
                    <p>Level : 2</p>
                    <img src="badge-bronze.png" alt="Badge">
                </article>
                <article class="skill-card">
                    <h3>skill name</h3>
                    <div class="skill-meter">
                        <div class="meter-bar beginner"></div>
                        <div class="meter-bar intermediate"></div>
                        <div class="meter-bar advanced"></div>
                    </div>
                    <p>Level : 3</p>
                    <img src="badge-gold.png" alt="Badge">
                </article>
            </div>
        </section>

        <section class="portfolio">
            <header class="section-header">
                <h2>Your Portfolio</h2>
                <button class="btn-action">Upload Artwork &rarr;</button>
            </header>
            <div class="portfolio-grid">
                <figure class="artwork-item">
                    <img src="art1.jpg" alt="Artwork 1">
                </figure>
                <figure class="artwork-item">
                    <img src="art2.jpg" alt="Artwork 2">
                </figure>
                <figure class="artwork-item">
                    <img src="art3.jpg" alt="Artwork 3">
                </figure>
            </div>
        </section>
    </main>

    <footer class="main-footer">
    </footer>
</body>
</html>
