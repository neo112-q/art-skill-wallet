<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History – ArtSkillWallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">

  <!-- Navbar -->
  <nav class="navbar" aria-label="Main navigation">
    <div class="navbar-inner">
      <a href="/home.html" class="nav-logo">
        <img src="/img/logoartskill.png" height="32" alt="ArtSkillWallet Logo">
        <span class="nav-logo-text">ArtSkillWallet</span>
      </a>
      <div class="nav-links">
        <a href="/explore.html" class="nav-link">Explore</a>
        <a href="/skillManage.html" class="nav-link">Skills</a>
        <a href="/history.html" class="nav-link active">History</a>
      </div>
      <div class="avatar-wrapper">
        <img :src="avatarUrl" alt="User avatar" class="avatar-sm" @click.stop="dropdownOpen = !dropdownOpen">
        <div class="avatar-dropdown" :class="{ open: dropdownOpen }">
          <div class="avatar-dropdown-header">
            <img :src="avatarUrl" alt="User avatar" class="avatar-dropdown-pic">
            <div>
              <p class="avatar-dropdown-name">{{ username }}</p>
              <p class="avatar-dropdown-email">{{ email }}</p>
            </div>
          </div>
          <div class="avatar-dropdown-divider"></div>
          <a href="/profile.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">👤</span> Profile</a>
          <a v-if="isAdmin" href="/admin.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">🛡️</span> Admin</a>
          <div class="avatar-dropdown-divider"></div>
          <button class="avatar-dropdown-item avatar-dropdown-logout" @click="doLogout"><span class="avatar-dropdown-icon">🚪</span> Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Two-column layout -->
  <div class="two-col-layout">

    <!-- Filter Panel -->
    <aside class="filter-panel">
      <div class="filter-card">
        <h2 class="filter-title">Filter</h2>
        <div class="filter-group">
          <label class="filter-label">Name</label>
          <input type="text" class="filter-input" v-model="filterName">
        </div>
        <div class="filter-group">
          <label class="filter-label">Skill</label>
          <input type="text" class="filter-input" v-model="filterSkill">
        </div>
        <div class="filter-group">
          <label class="filter-label">Level</label>
          <input type="text" class="filter-input" v-model="filterLevel">
        </div>
        <div class="filter-group">
          <label class="filter-label">Tag</label>
          <input type="text" class="filter-input" v-model="filterTag">
        </div>
      </div>
    </aside>

    <!-- Timeline -->
    <main class="timeline-area">
      <div class="timeline-wrap">
        <div class="timeline-line"></div>
        <template v-for="g in filteredGroups" :key="g.date">
          <div class="timeline-group">
            <div class="timeline-date" v-html="g.dateLabel"></div>
            <div class="timeline-dot"></div>
            <div class="timeline-entries">
              <div class="timeline-card" v-for="e in g.entries" :key="e.text">
                <div class="timeline-thumb">
                  <img v-if="e.img" :src="e.img" :alt="e.text">
                  <span v-else class="timeline-icon">⬆️</span>
                </div>
                <div class="timeline-text">
                  <p v-html="e.text"></p>
                  <span class="timeline-tag" v-for="t in e.tags" :key="t">{{ t }}</span>
                </div>
              </div>
            </div>
          </div>
        </template>
      </div>
    </main>

  </div>

</div>

<script src="/js/app.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
if (!TokenStore.isLoggedIn()) { window.location.replace('/home.html'); }
const { createApp } = Vue;
createApp({
  data() {
    return {
      isAdmin: TokenStore.isAdmin(),
      username: TokenStore.getUsername() || 'User',
      email: '',
      avatarUrl: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=100&q=80',
      dropdownOpen: false,
      filterName: '', filterSkill: '', filterLevel: '', filterTag: '',
      groups: [
        { date: '2026-12-26', dateLabel: '26 December<br>2026', name: 'beauty path to violent,character design is now advanced', skill: 'Character Design', level: 'Advanced', tags: 'digital,character,upload,levelup', entries: [
          { img: 'https://images.unsplash.com/photo-1607604276583-eef5d076aa5f?w=160&q=80', text: 'You upload :<br><strong>Beauty path to violent</strong>', tags: ['Character Design'] },
          { img: '', text: 'You level up :<br><strong>Character Design is now Advanced</strong>', tags: ['Advanced'] },
        ]},
        { date: '2026-11-26', dateLabel: '26 November<br>2026', name: 'sloth dream', skill: 'Illustration', level: 'Intermediate', tags: 'illustration,moon,upload', entries: [
          { img: 'https://images.unsplash.com/photo-1614732414444-096e5f1122d5?w=160&q=80', text: 'You upload :<br><strong>Sloth dream</strong>', tags: ['Illustration','Intermediate'] },
        ]},
        { date: '2026-10-26', dateLabel: '26 October<br>2026', name: 'swallow in the pretty face', skill: 'Digital Painting', level: 'Intermediate', tags: 'painting,portrait,upload', entries: [
          { img: 'https://images.unsplash.com/photo-1578301978162-7aae4d755744?w=160&q=80', text: 'You upload :<br><strong>Swallow in the pretty face</strong>', tags: ['Digital Painting'] },
        ]},
        { date: '2026-09-14', dateLabel: '14 September<br>2026', name: 'neon citadel', skill: 'Concept Art', level: 'Advanced', tags: 'concept,environment,upload', entries: [
          { img: 'https://images.unsplash.com/photo-1566004100631-35d015d6a491?w=160&q=80', text: 'You upload :<br><strong>Neon Citadel</strong>', tags: ['Concept Art','Advanced'] },
        ]},
        { date: '2026-08-02', dateLabel: '2 August<br>2026', name: 'forest spirit,illustration is now intermediate', skill: 'Illustration', level: 'Intermediate', tags: 'illustration,nature,upload,levelup', entries: [
          { img: 'https://images.unsplash.com/photo-1611085583191-a3b181a88401?w=160&q=80', text: 'You upload :<br><strong>Forest Spirit</strong>', tags: ['Illustration'] },
          { img: '', text: 'You level up :<br><strong>Illustration is now Intermediate</strong>', tags: ['Intermediate'] },
        ]},
        { date: '2026-07-10', dateLabel: '10 July<br>2026', name: 'void walker', skill: 'Character Design', level: 'Advanced', tags: 'character,darkfantasy,upload', entries: [
          { img: 'https://images.unsplash.com/photo-1549490349-8643362247b5?w=160&q=80', text: 'You upload :<br><strong>Void Walker</strong>', tags: ['Character Design'] },
        ]},
      ],
    };
  },
  computed: {
    filteredGroups() {
      const n = this.filterName.toLowerCase(), s = this.filterSkill.toLowerCase(), l = this.filterLevel.toLowerCase(), t = this.filterTag.toLowerCase();
      return this.groups.filter(g =>
        (!n || g.name.toLowerCase().includes(n)) &&
        (!s || g.skill.toLowerCase().includes(s)) &&
        (!l || g.level.toLowerCase().includes(l)) &&
        (!t || g.tags.toLowerCase().includes(t))
      );
    },
  },
  methods: {
    doLogout() { logout(); },
  },
  mounted() {
    document.addEventListener('click', () => { this.dropdownOpen = false; });
  }
}).mount('#app');
</script>
</body>
</html>
