<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>History – ArtSkillWallet</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div id="app">

  <!-- Navbar -->
  <nav class="navbar" aria-label="Main navigation">
    <div class="navbar-inner">
      <a href="/home.html" class="nav-logo">
        <img src="/img/logoartskill.png" height="32" alt="ArtSkillWallet Logo">
        <span class="nav-logo-text">ArtSkillWallet</span>
      </a>
      <div class="nav-links">
        <a href="/explore.html" class="nav-link">Explore</a>
        <a href="/skillManage.html" class="nav-link">Skills</a>
        <a href="/history.html" class="nav-link active">History</a>
      </div>
      <div class="avatar-wrapper">
        <img :src="displayAvatar" alt="User avatar" class="avatar-sm" @click.stop="dropdownOpen = !dropdownOpen">
        <div class="avatar-dropdown" :class="{ open: dropdownOpen }">
          <div class="avatar-dropdown-header">
            <img :src="displayAvatar" alt="User avatar" class="avatar-dropdown-pic">
            <div>
              <p class="avatar-dropdown-name">{{ username }}</p>
            </div>
          </div>
          <div class="avatar-dropdown-divider"></div>
          <a href="/profile.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">👤</span> Profile</a>
          <a v-if="isAdmin" href="/admin.html" class="avatar-dropdown-item"><span class="avatar-dropdown-icon">🛡️</span> Admin</a>
          <div class="avatar-dropdown-divider"></div>
          <button class="avatar-dropdown-item avatar-dropdown-logout" @click="doLogout"><span class="avatar-dropdown-icon">🚪</span> Logout</button>
        </div>
      </div>
      <button class="hamburger-btn" :class="{ open: mobileOpen }" @click="mobileOpen = !mobileOpen" aria-label="Menu">
        <span class="hamburger-bar"></span><span class="hamburger-bar"></span><span class="hamburger-bar"></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Nav Drawer -->
  <div class="mobile-nav" :class="{ open: mobileOpen }" @click.self="mobileOpen=false">
    <a href="/explore.html" class="mobile-nav-link"><i class="fas fa-compass"></i> Explore</a>
    <a href="/skillManage.html" class="mobile-nav-link"><i class="fas fa-star"></i> Skills</a>
    <a href="/history.html" class="mobile-nav-link active"><i class="fas fa-history"></i> History</a>
    <div class="mobile-nav-divider"></div>
    <a href="/profile.html" class="mobile-nav-link"><i class="fas fa-user"></i> Profile</a>
    <a v-if="isAdmin" href="/admin.html" class="mobile-nav-link"><i class="fas fa-shield-alt"></i> Admin</a>
    <button class="mobile-nav-link" style="background:none;border:none;cursor:pointer;color:#ff6b6b;width:100%;text-align:left;" @click="doLogout"><i class="fas fa-sign-out-alt"></i> Logout</button>
  </div>

  <!-- Mobile Filter Toggle -->
  <div class="mobile-filter-bar">
    <button class="mobile-filter-btn" @click="filterOpen = !filterOpen">
      <i class="fas fa-filter"></i> Filters
      <span v-if="filterTitle || filterSkill || filterStatus" class="mobile-filter-badge">●</span>
    </button>
  </div>

  <!-- Two-column layout -->
  <div class="two-col-layout">

    <!-- Filter Panel -->
    <aside class="filter-panel" :class="{ 'mobile-open': filterOpen }">
      <div class="filter-card">
        <h2 class="filter-title">Filter</h2>
        <div class="filter-group">
          <label class="filter-label">Title</label>
          <input type="text" class="filter-input" v-model="filterTitle" placeholder="Search title...">
        </div>
        <div class="filter-group">
          <label class="filter-label">Skill</label>
          <input type="text" class="filter-input" v-model="filterSkill" placeholder="e.g. Watercolor">
        </div>
        <div class="filter-group">
          <label class="filter-label">Status</label>
          <select class="filter-input" v-model="filterStatus">
            <option value="">All Status</option>
            <option>Pending</option>
            <option>Approved</option>
            <option>Rejected</option>
          </select>
        </div>
        <div class="filter-group">
          <label class="filter-label">Sort</label>
          <select class="filter-input" v-model="sortDir">
            <option value="desc">Newest First</option>
            <option value="asc">Oldest First</option>
          </select>
        </div>
        <button v-if="filterTitle || filterSkill || filterStatus || sortDir !== 'desc'"
          @click="filterTitle=''; filterSkill=''; filterStatus=''; sortDir='desc'"
          style="width:100%; margin-top:0.5rem; background:none; border:1px solid #2A2A2A; border-radius:8px; padding:0.45rem; color:#888; font-size:0.8rem; cursor:pointer;">
          Clear Filters
        </button>
      </div>
    </aside>

    <!-- Timeline -->
    <main class="timeline-area">

      <!-- Loading -->
      <div v-if="loading" style="text-align:center; padding:3rem; color:#888;">Loading timeline...</div>

      <!-- Empty -->
      <div v-else-if="!filteredEvents.length" style="text-align:center; padding:3rem; color:#555;">
        <p v-if="events.length">No events match your filters.</p>
        <p v-else>No activity yet. <a href="/upload.html" style="color:#CCFF00;">Upload your first artwork</a> or <a href="/skillManage.html" style="color:#CCFF00;">add a skill</a>.</p>
      </div>

      <div v-else class="timeline-wrap">
        <div class="timeline-line"></div>

        <div class="timeline-group" v-for="(group, gi) in groupedEvents" :key="gi">
          <div class="timeline-date" v-html="group.dateLabel"></div>
          <div class="timeline-dot"></div>
          <div class="timeline-entries">
            <div class="timeline-card" v-for="(ev, ei) in group.items" :key="ei">
              <div class="timeline-thumb">
                <span v-if="ev.type === 'upload'" class="timeline-icon">🎨</span>
                <span v-else class="timeline-icon">⬆️</span>
              </div>
              <div class="timeline-text">
                <p>You uploaded :<br><strong>{{ ev.title }}</strong></p>
                <template v-if="ev.skill_names && ev.skill_names.length">
                  <span class="timeline-tag" v-for="sn in ev.skill_names" :key="sn">{{ sn }}</span>
                </template>
                <span v-if="ev.status" style="font-size:0.68rem; font-weight:700; padding:0.15rem 0.5rem; border-radius:4px; margin-left:0.25rem;"
                  :style="{ background: ev.status==='Approved' ? 'rgba(34,197,94,0.15)' : ev.status==='Rejected' ? 'rgba(239,68,68,0.15)' : 'rgba(234,179,8,0.15)', color: ev.status==='Approved' ? '#4ade80' : ev.status==='Rejected' ? '#f87171' : '#fbbf24' }">
                  {{ ev.status }}
                </span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

  </div>

</div>

<script src="/js/app.js"></script>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
if (!TokenStore.isLoggedIn()) { window.location.replace('/home.html'); }
const { createApp } = Vue;
createApp({
  data() {
    return {
      isAdmin: TokenStore.isAdmin(),
      username: TokenStore.getUsername() || 'User',
      profilePicture: '',
      dropdownOpen: false,
      loading: true,
      events: [],
      filterTitle: '',
      filterSkill: '',
      filterStatus: '',
      sortDir: 'desc',
      mobileOpen: false,
      filterOpen: false,
    };
  },
  computed: {
    displayAvatar() {
      return this.profilePicture || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(this.username) + '&background=CCFF00&color=121212&bold=true&size=100';
    },
    filteredEvents() {
      const t = this.filterTitle.toLowerCase();
      const s = this.filterSkill.toLowerCase();
      const st = this.filterStatus;
      let result = this.events.filter(e =>
        (!t  || e.title.toLowerCase().includes(t)) &&
        (!s  || (e.skill_names || []).some(sn => sn.toLowerCase().includes(s))) &&
        (!st || e.status === st)
      );
      result = [...result].sort((a, b) => {
        const diff = new Date(a.date) - new Date(b.date);
        return this.sortDir === 'asc' ? diff : -diff;
      });
      return result;
    },
    groupedEvents() {
      const groups = [];
      const map = {};
      this.filteredEvents.forEach(ev => {
        const d = new Date(ev.date);
        const key = d.toISOString().slice(0, 10);
        if (!map[key]) {
          const label = d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long' }) + '<br>' + d.getFullYear();
          map[key] = { dateLabel: label, items: [] };
          groups.push(map[key]);
        }
        map[key].items.push(ev);
      });
      return groups;
    },
  },
  methods: {
    doLogout() { logout(); },
  },
  async mounted() {
    document.addEventListener('click', () => { this.dropdownOpen = false; });

    const meRes = await apiFetch('/me');
    if (meRes.ok && meRes.data.data?.profile_picture) this.profilePicture = meRes.data.data.profile_picture;

    console.log('[HISTORY] Fetching GET /history …');
    const r = await apiFetch('/history');
    console.log('[HISTORY] Response:', r.status, r.data);

    if (r.ok && r.data.data) {
      this.events = r.data.data;
      console.log('[HISTORY] Loaded', this.events.length, 'events');
    } else {
      console.error('[HISTORY] Failed:', r.data.error_message);
    }
    this.loading = false;
  }
}).mount('#app');
</script>
</body>
</html>
